name: checks

on:
  push:
    branches: [main]
    # Release tags too, so that what gets published is what was checked.
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      # TensorFlow's startup banner, three times per test session, drowns
      # anything worth reading in the log.
      TF_CPP_MIN_LOG_LEVEL: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from `git describe`, so the build needs the
          # history *and* the tags. The default checkout is shallow and
          # fetches neither, which would install Zeus as some `0.1.devN` with
          # no tag in sight — and on a release tag would silently not produce
          # the released version. See docs/versioning-and-releases.md.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # The floor and the ceiling both: TensorFlow 2.12 has no wheels for
          # 3.11 or newer, which is why `requires-python` pins this.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

  # The package sits in src/ so that an import can only resolve to the
  # installed distribution — which is worth nothing unless something actually
  # builds the distribution and looks inside it. Zeus ships two architecture
  # YAMLs that are loaded relative to __file__, and a wheel that lost them
  # would pass every check above while failing for anyone installing it.
  wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build a wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist

      - name: The wheel carries its data files and its entry point
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          print(f"{wheel.name}: {len(names)} files")

          required = [
              "zeus/model/architectures/grand24.yaml",
              "zeus/model/architectures/solo26.yaml",
              "zeus/py.typed",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"the wheel is missing: {', '.join(missing)}")

          entry_points = next(name for name in names if name.endswith("entry_points.txt"))
          text = zipfile.ZipFile(wheel).read(entry_points).decode()
          if "zeus = zeus.cli.run:run" not in text:
              raise SystemExit(f"the console script is not declared:\n{text}")

          print("data files and entry point present")
          PY
