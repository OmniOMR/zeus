[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeus"]

[tool.hatch.metadata]
allow-direct-references = true

# The version is read from the git tags rather than written down here, so that
# every commit builds as a distinct version — see docs/versioning-and-releases.md.
# Zeus is a single package at the repository root, so unlike the Musibot
# components this needs no `root`, no `--match` and no `tag_regex`:
# setuptools-scm finds the repository here and strips a leading `v` itself.
[tool.hatch.version]
source = "vcs"

[project]
name = "zeus"
dynamic = ["version"]
authors = [
  { name="Jiří Mayer", email="mayer@ufal.mff.cuni.cz" },
]
dependencies = [
    "tensorflow~=2.12.0",
    "pyyaml",
    "tqdm",
    "linearized-musicxml @ git+https://github.com/OMR-Research/lmx.git@87fca1c38bda83bc032596ab00af28412f92941d",
    "levenshtein"
]
description = "Image-to-sequence model Optical Music Recognition"
readme = "README.md"
# Pinned to 3.10 rather than left open-ended, because TensorFlow 2.12 has no
# wheels for 3.11 or newer. `~=3.10` used to be written here, which permits
# 3.11 and 3.12 and so promised an installation that cannot work.
requires-python = ">=3.10,<3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/OmniOMR/zeus"
Issues = "https://github.com/OmniOMR/zeus/issues"

# `scripts`, not `gui-scripts`. The two behave alike on Linux, but a gui-script
# is built as a no-console executable on Windows, where a CLI would then print
# nowhere at all.
[project.scripts]
zeus = "zeus.cli.run:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# The rule set is named rather than left to ruff's default, because that
# default is not stable across ruff versions: 0.16 enables some 415 rules where
# earlier releases enabled a few dozen, so an unpinned selection means two
# developers on two ruff versions see two different code bases. `dev` allows
# `ruff>=0.6`, so this has to be said out loud.
[tool.ruff.lint]
select = [
    "E",       # pycodestyle — including bare `except:`
    "F",       # pyflakes — unused imports and names, real mistakes
    "I",       # import sorting
    "UP",      # constructs made obsolete by the python version we require
    "B",       # bugbear — likely bugs rather than style
    "SIM",     # simplifications that remove a branch or a temporary
    "C4",      # comprehensions written the long way
    "PLR1722", # `exit()` instead of `sys.exit()`; `exit` is installed by the
               # `site` module and is simply absent under `python -S`, which
               # would turn a clean CLI exit into a NameError
]

# Deliberately not `strict = true`, which is what the Musibot components run.
# TensorFlow 2.12 and h5py ship no type information, and this codebase descends
# from research code written without annotations, so strict mode would report
# hundreds of errors that say nothing about correctness. These settings catch
# real mistakes inside the functions we have; the screws can be tightened as
# annotations arrive.
[tool.mypy]
files = ["src/zeus", "tests"]
mypy_path = "src"
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
